name: Build OpenWrt for Velo7 Max

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of z21100644/openwrt to build
        default: velo7max-fixes

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools python3-dev rsync swig \
            unzip zlib1g-dev file wget zstd quilt xsltproc

      - name: Build
        env:
          JOBS: 4
        run: |
          sed -i "s/^BRANCH=.*/BRANCH=${{ inputs.branch }}/" build.sh
          chmod +x build.sh
          ./build.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Collect images
        run: |
          mkdir out
          cp openwrt/bin/targets/mediatek/filogic/*ltc_vl7m19k* out/
          cp openwrt/bin/targets/mediatek/filogic/sha256sums out/
          cp openwrt/bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-velo7max-${{ github.run_number }}
          path: out/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: openwrt/logs/
