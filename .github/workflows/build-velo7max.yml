name: Build OpenWrt for Velo7 Max

# Self-contained: this one file is all the repo needs.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch of z21100644/openwrt to build
        default: velo7max-fixes
      luci:
        description: Include the LuCI web interface
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REPO: https://github.com/z21100644/openwrt.git
      BUILD_LOG: 1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools python3-dev rsync swig \
            unzip zlib1g-dev file wget zstd quilt xsltproc

      - name: Clone source
        run: |
          git clone --depth 1 -b "${{ inputs.branch }}" "$REPO" openwrt
          cd openwrt
          git log -1 --format='Building %h %s (%ad)' --date=short
          grep '^PKG_VERSION' package/boot/uboot-mediatek/Makefile

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_ltc_vl7m19k=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_uboot-envtools=y
          EOF
          if [ "${{ inputs.luci }}" = "true" ]; then
            printf 'CONFIG_PACKAGE_luci=y\nCONFIG_PACKAGE_luci-ssl=y\n' >> .config
          fi
          sed -i 's/^ *//' .config
          make defconfig
          grep -E 'DEVICE_ltc_vl7m19k|^CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Build
        working-directory: openwrt
        run: |
          set -o pipefail
          ( make -j4 || make -j1 V=s ) 2>&1 | tee ../build-output.log

      - name: Collect images
        run: |
          mkdir out
          cp openwrt/bin/targets/mediatek/filogic/*ltc_vl7m19k* out/
          cp openwrt/bin/targets/mediatek/filogic/sha256sums out/
          cp openwrt/bin/targets/mediatek/filogic/*.manifest out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v6
        with:
          name: openwrt-velo7max-${{ github.run_number }}
          path: out/

      - name: Show the error
        if: failure()
        run: |
          echo "===== last 80 lines of build output ====="
          tail -n 80 build-output.log 2>/dev/null || true
          echo "===== package logs mentioning errors ====="
          grep -rlE "Error [0-9]|error:" openwrt/logs 2>/dev/null | head -20 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            build-output.log
            openwrt/logs/
