name: Sync Upstream OpenWrt

# Merges OpenWrt main into the ltc_vl7m19k firmware branch every 5 days.
# When it merged something, it starts the firmware build, which publishes
# a new release. Nothing is deleted.

on:
  schedule:
    # Checked daily at 18:00 UTC (20:00 in Romania in winter, 21:00 in
    # summer); it only syncs when the last sync is at least SYNC_EVERY_DAYS
    # old. Starting it by hand always syncs.
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  SYNC_EVERY_DAYS: 5

permissions:
  contents: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ltc_vl7m19k
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/openwrt/openwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/openwrt/openwrt.git

      - name: Fetch upstream
        run: git fetch --no-tags upstream main

      - name: Check for updates
        id: check
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(git log -1 --format=%ct --committer="GitHub Actions" --grep="Merge remote-tracking branch 'upstream/main'" HEAD || true)
            if [ -n "$last" ]; then
              # in hours, with 2 h slack: the merge is committed a few
              # minutes after the scheduled start
              age_h=$(( ($(date +%s) - last) / 3600 ))
              if [ "$age_h" -lt $(( SYNC_EVERY_DAYS * 24 - 2 )) ]; then
                echo "Last sync was $(( age_h / 24 )) day(s) ago, next one after $SYNC_EVERY_DAYS days"
                echo "has_updates=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No updates available (upstream: ${REMOTE:0:7}, local: ${LOCAL:0:7})"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates available: ${LOCAL:0:7} -> ${REMOTE:0:7}"
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git merge --no-ff --no-commit upstream/main || true
          git rev-parse -q --verify MERGE_HEAD >/dev/null

          # This branch keeps only its own workflows, so drop whatever
          # upstream changes or adds below .github/workflows
          git rm -rfq --ignore-unmatch -- .github/workflows
          git checkout HEAD -- .github/workflows

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Merge failed. Conflicts need manual resolution."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -q --no-edit

      - name: Push to origin
        if: steps.check.outputs.has_updates == 'true'
        run: git push origin ltc_vl7m19k

      - name: Start firmware build
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-ltc-vl7m19k.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f release_type=release \
            -f release_notes="Nightly build: LTC Velo7 Max firmware (PR #25926 fixes, 10G ports wan10g/lan10g) on OpenWrt main as of $(git log -1 --format=%cs upstream/main)."

      - name: Show result
        if: always()
        run: |
          echo "=== Sync Result ==="
          git log --oneline -5 || true
          echo "=== Remote Status ==="
          git remote -v || true
