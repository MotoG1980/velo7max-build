name: Build LTC Velo7 Max firmware (OpenWrt 25.12)

# Builds the OpenWrt 25.12 port kept on the v25.12-ltc_vl7m19k branch of
# this repository (stable 25.12 branch, Linux 6.12, the Realtek rtl8261n
# 10G PHY driver, ports named wan10g and lan10g) and publishes it as a
# release. Started by hand only.

on:
  workflow_dispatch:
    inputs:
      config_seed:
        description: 'Build config'
        required: true
        default: 'ltc_vl7m19k.config'
        type: choice
        options:
          - ltc_vl7m19k.config
      release_type:
        description: 'Release Type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

concurrency:
  group: build-ltc-vl7m19k-25.12-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG_SEED: ${{ inputs.config_seed || 'ltc_vl7m19k.config' }}
  RELEASE_TYPE: ${{ inputs.release_type || 'release' }}
  TARGET_DIR: bin/targets/mediatek/filogic
  DEVICE: ltc_vl7m19k
  SOURCE_BRANCH: v25.12-ltc_vl7m19k
  UPSTREAM_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/openwrt/openwrt.git 2>/dev/null || true
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          build_date=$(TZ=Asia/Taipei date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=8 HEAD)
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          upstream_commit=$(git rev-parse --short=8 "$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH")")

          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "build_id=${build_date}-${repo_commit}-${upstream_commit}" >> $GITHUB_OUTPUT
          echo "Build version: ${build_date}-${repo_commit} (upstream ${upstream_commit})"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # The argon theme keeps its Makefile at the repository root, which
          # the feeds scanner cannot index, so it goes into package/ instead
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/luci-theme-argon

      - name: Configure
        run: |
          cp "$CONFIG_SEED" .config
          make defconfig
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          bash scripts/set-build-version.sh .config
          make defconfig
          # make defconfig silently drops symbols it cannot resolve
          missing=0
          while read -r line; do
            grep -qxF "$line" .config || { echo "missing after defconfig: $line"; missing=1; }
          done < <(grep -E '^CONFIG_.*=y$' "$CONFIG_SEED")
          [ "$missing" = 0 ]
          grep -E 'CONFIG_(VERSION_DIST|VERSION_NUMBER|VERSION_CODE|TARGET_PROFILE)=' .config

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          make -j$(nproc) world 2>&1 | tee build.log

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          failed_pkg=$(grep 'ERROR:.*failed to build' build.log | head -1 | sed 's/.*ERROR: \(.*\) failed to build.*/\1/' || true)
          if [ -n "$failed_pkg" ]; then
            echo "=== Rebuilding $failed_pkg with V=s ==="
            make "$failed_pkg/compile" V=s -j1 2>&1 | tee build-verbose.log || true
            grep -nE "error:|Error [0-9]|FAILED|Patch failed|No rule to make target" build-verbose.log | head -40 || true
            tail -80 build-verbose.log || true
          else
            echo "No failing package found in build.log" >&2
            tail -150 build.log || true
          fi

      # Show the failure as annotations, readable from the run summary and
      # the API without downloading the logs
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g'; }
          for f in build-verbose.log build.log; do
            [ -s "$f" ] || continue
            hits=$(grep -nE "error:|Error [0-9]|FAILED|Patch failed|failed to build|No rule to make target|Hunk #[0-9]+ FAILED|undefined reference|ERROR:" "$f" | head -40)
            [ -n "$hits" ] && echo "::error title=$f errors::$(printf '%s\n' "$hits" | cut -c1-300 | enc)"
            echo "::error title=$f tail::$(tail -n 60 "$f" | cut -c1-300 | enc)"
          done

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
          fi
          ls -la "$TARGET_DIR" 2>/dev/null || echo "No files in $TARGET_DIR"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-25.12-${{ steps.version.outputs.date }}-${{ steps.version.outputs.repo_commit }}
          path: |
            build.log
            build-verbose.log
            ${{ env.TARGET_DIR }}/*${{ env.DEVICE }}*
            ${{ env.TARGET_DIR }}/config.buildinfo
            ${{ env.TARGET_DIR }}/feeds.buildinfo
            ${{ env.TARGET_DIR }}/version.buildinfo
            ${{ env.TARGET_DIR }}/sha256sums
          retention-days: 30

      - name: Create release
        if: env.RELEASE_TYPE != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v25.12-${{ env.DEVICE }}-${{ steps.version.outputs.date }}-${{ steps.version.outputs.repo_commit }}
          target_commitish: ${{ steps.version.outputs.sha }}
          name: ${{ steps.version.outputs.date }} - LTC Velo7 Max OpenWrt 25.12 Build (${{ steps.version.outputs.repo_commit }})
          body: ${{ inputs.release_notes }}
          prerelease: ${{ env.RELEASE_TYPE == 'prerelease' }}
          files: |
            ${{ env.TARGET_DIR }}/*${{ env.DEVICE }}*
            ${{ env.TARGET_DIR }}/config.buildinfo
            ${{ env.TARGET_DIR }}/feeds.buildinfo
            ${{ env.TARGET_DIR }}/version.buildinfo
            ${{ env.TARGET_DIR }}/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep only the newest firmware releases; older ones are deleted
      # together with their tags. Change KEEP to keep more or fewer.
      - name: Delete old releases
        if: success() && env.RELEASE_TYPE != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 2
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[]|select(.tag_name|startswith("v25.12-ltc_vl7m19k-"))|[.created_at,.id,.tag_name]|@tsv' |
            sort -r | tail -n +$((KEEP + 1)) |
            while IFS=$'\t' read -r created id tag; do
              echo "Deleting release $tag ($created)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
            done
